<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de colores de alerta/fuego para el pin -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" /> <!-- Amarillo intenso -->
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" /> <!-- Naranja fuego -->
      <stop offset="100%" style="stop-color:#D90429;stop-opacity:1" /> <!-- Rojo peligro -->
    </linearGradient>
  </defs>

  <!-- Fondo oscuro con bordes redondeados (estilo app moderna) -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="#1A1A1A" />

  <!-- Forma principal: Pin de mapa -->
  <path d="M 256 90 C 165 90 90 165 90 256 C 90 350 256 460 256 460 C 256 460 422 350 422 256 C 422 165 347 90 256 90 Z" fill="url(#fireGrad)" />

  <!-- Corte interior: Silueta de la llama principal (negativo) -->
  <path d="M 256 150 C 256 150 190 230 190 290 C 190 325 220 350 256 350 C 292 350 322 325 322 290 C 322 230 256 150 256 150 Z" fill="#1A1A1A" />

  <!-- Llama interior más pequeña brillando -->
  <path d="M 256 220 C 256 220 220 270 220 305 C 220 325 235 340 256 340 C 277 340 292 325 292 305 C 292 270 256 220 256 220 Z" fill="#FFB703" />
</svg>
